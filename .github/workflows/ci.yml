# CI pipeline (docs/engineering/testing.md): fastest feedback first.
# Merge requires all green + one review; main is always releasable (ADR-033).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static (types, lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build (Next.js) + migration check
    runs-on: ubuntu-latest
    needs: [static, unit]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: before_academy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/before_academy
      DIRECT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/before_academy
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-env
      BETTER_AUTH_URL: http://localhost:3000
      GUEST_TOKEN_SECRET: ci-only-secret-not-used-in-any-env
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations against a clean database
        run: npm run db:migrate
      - run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: before_academy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/before_academy
      DIRECT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/before_academy
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-env
      BETTER_AUTH_URL: http://localhost:3000
      GUEST_TOKEN_SECRET: ci-only-secret-not-used-in-any-env
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
